[project]
name = "jevspan"
version = "0.1.0"
description = "Zero-shot named entity recognition built on TypeSafe Jev: punctuation-guided spans, calibrated scores, no training"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JevSpan contributors" }]
keywords = ["ner", "named-entity-recognition", "zero-shot", "information-extraction", "jev", "typesafe", "chinese-nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
jevspan = "jevspan.cli:main"
jevspan-web = "jevspan.web:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
