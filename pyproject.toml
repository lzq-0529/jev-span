[project]
name = "jev-ner"
version = "0.1.0"
description = "Punctuation-driven entity recognition (person / organization / address) scored by TypeSafe Jev"
readme = "README.md"
authors = [
    { name = "Cursor Agent", email = "cursoragent@cursor.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
jev-ner = "jev_ner.cli:main"
jev-ner-web = "jev_ner.web:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
