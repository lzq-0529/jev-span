<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JevSpan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'%3EJ%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="title-row">
        <h1>JevSpan <span class="h1-sub" data-i18n="subtitle"></span></h1>
        <button id="lang" class="lang-switch" type="button"></button>
      </div>
      <p class="sub" data-i18n="intro"></p>
    </div>
  </header>

  <main class="wrap grid">
    <section class="card input-card">
      <div class="schema-row">
        <label for="preset" class="label" data-i18n="entityTypes"></label>
        <select id="preset"></select>
      </div>
      <details class="schema-edit">
        <summary data-i18n="editSchema"></summary>
        <textarea id="schema" rows="10" spellcheck="false"></textarea>
        <p class="hint" data-i18n="schemaHint"></p>
      </details>

      <label for="text" class="label" data-i18n="inputText"></label>
      <textarea id="text" rows="8" maxlength="5000"></textarea>
      <div class="samples" id="samples"></div>
      <div class="row">
        <label class="toggle"><input type="checkbox" id="ctx" checked /> <span data-i18n="optContext"></span></label>
        <label class="toggle"><input type="checkbox" id="win" checked /> <span data-i18n="optWindow"></span></label>
        <label class="toggle"><input type="checkbox" id="prop" checked /> <span data-i18n="optPropagate"></span></label>
        <select id="refine">
          <option value="choice" data-i18n="refineChoice"></option>
          <option value="scan" data-i18n="refineScan"></option>
        </select>
        <span class="count" id="count">0 / 5000</span>
      </div>
      <button id="run" class="btn" data-i18n="run"></button>
      <p class="status" id="status" role="status"></p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 data-i18n="results"></h2>
        <div class="legend" id="legend"></div>
      </div>
      <div id="highlight" class="highlight empty" data-i18n="resultsEmpty"></div>
      <div id="usage" class="usage"></div>
      <table id="table" class="table" hidden>
        <thead><tr>
          <th data-i18n="colType"></th><th data-i18n="colEntity"></th><th data-i18n="colSpan"></th>
          <th data-i18n="colScore"></th><th data-i18n="colSource"></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card full">
      <div class="card-head">
        <h2 data-i18n="trace"></h2>
        <span class="hint" data-i18n="traceHint"></span>
      </div>
      <div id="trace" class="trace empty" data-i18n="traceEmpty"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
